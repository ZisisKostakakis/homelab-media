route:
  receiver: ntfy-bridge
  # target = container extracted from autoheal lines (ContainerRestartLoop)
  group_by: ['alertname', 'container_name', 'target']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Critical alerts go out faster and re-notify hourly until resolved.
    - matchers: ['severity="critical"']
      receiver: ntfy-bridge
      group_wait: 10s
      repeat_interval: 1h

inhibit_rules:
  # A failed cascade restart explains everything downstream of the VPN.
  - source_matchers: ['alertname="CascadeRestartFailed"']
    target_matchers: ['alertname=~"GluetunFlapping|PortForwardingDead|ArrImportFailures|HighErrorRate"']
  # Missing download path is the root cause of that app's import failures.
  - source_matchers: ['alertname="ArrDownloadPathMissing"']
    target_matchers: ['alertname="ArrImportFailures"']
    equal: ['container_name']

receivers:
  - name: ntfy-bridge
    webhook_configs:
      - url: http://ntfy-bridge:8183/
        send_resolved: true
