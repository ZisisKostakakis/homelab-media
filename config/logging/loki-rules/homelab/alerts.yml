groups:
  - name: homelab-container-errors
    rules:
      - alert: HighErrorRate
        expr: |
          sum by (container_name) (
            rate({job="docker"} |~ "(?i)\\b(error|fatal|panic)\\b" [5m])
          ) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High error rate in {{ $labels.container_name }}"
          description: "{{ $labels.container_name }} is logging errors at {{ printf \"%.2f\" $value }}/s over 5m."

      # ContainerLogSilence: enable after observing baseline log behavior.
      # - alert: ContainerLogSilence
      #   expr: |
      #     sum by (container_name) (count_over_time({job="docker"}[15m])) == 0
      #   for: 15m
      #   labels:
      #     severity: warning
      #   annotations:
      #     summary: "{{ $labels.container_name }} has stopped logging"
      #     description: "No log lines from {{ $labels.container_name }} for 15m."

  # VPN / port-forwarding health, driven by gluetun-monitor's own log lines
  # (scripts/gluetun-cascade-restart.sh). Message strings must match log_event calls.
  - name: homelab-vpn
    rules:
      - alert: CascadeRestartFailed
        expr: |
          sum(count_over_time({container_name="gluetun-monitor"} |= "All cascade restart attempts failed" [10m])) > 0
        labels:
          severity: critical
        annotations:
          summary: "Torrent stack did not recover after a gluetun restart"
          description: "gluetun-monitor exhausted its cascade restart attempts. VPN-dependent services are likely down."

      - alert: GluetunFlapping
        expr: |
          sum(count_over_time({container_name="gluetun-monitor"} |= "Gluetun restart confirmed" [1h])) >= 3
        labels:
          severity: warning
        annotations:
          summary: "Gluetun restarted {{ $value }} times in the last hour"
          description: "Repeated VPN restarts usually mean a bad server/endpoint or expired WireGuard credentials."

      - alert: PortForwardingDead
        expr: |
          sum(count_over_time({container_name="gluetun-monitor"} |= "port forwarding is dead" [15m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Gluetun holds no forwarded port"
          description: "The port-forward watchdog has found no forwarded port for 15m+. Torrents will have no incoming peers."

      - alert: WatchdogRestartSuppressed
        expr: |
          sum(count_over_time({container_name="gluetun-monitor"} |= "gluetun restart suppressed" [30m])) > 0
        labels:
          severity: critical
        annotations:
          summary: "Port-forward watchdog hit its restart limit"
          description: "Watchdog wanted to restart gluetun but WATCHDOG_MAX_RESTARTS_PER_HOUR is used up. Manual attention needed."

  # Restart loops: autoheal logs one line per restart it performs.
  # Format: "<date> Container /<name> (<id>) found to be unhealthy - Restarting container now ..."
  - name: homelab-restarts
    rules:
      - alert: ContainerRestartLoop
        expr: |
          sum by (target) (
            count_over_time(
              {container_name="autoheal"} |= "found to be unhealthy"
                | regexp `Container /?(?P<target>[^ ]+) \(` [30m]
            )
          ) >= 3
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.target }} restarted by autoheal {{ $value }} times in 30m"
          description: "Restarting is not fixing {{ $labels.target }}; check its logs for the underlying failure."

      - alert: AutohealRestartFailed
        expr: |
          sum(count_over_time({container_name="autoheal"} |= "Restarting container" |= "failed" [10m])) > 0
        labels:
          severity: critical
        annotations:
          summary: "autoheal failed to restart a container"
          description: "docker restart returned an error from autoheal; the container is probably stuck."
