name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compose:
    name: Validate compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: |
          # Stacks reference .env values; unset vars only produce warnings.
          for f in docker-compose-*.yml; do
            echo "::group::$f"
            docker compose -f "$f" config -q
            echo "::endgroup::"
          done

  alerting:
    name: Validate alert rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Loki rules
        run: |
          docker run --rm -v "$PWD/config/logging/loki-rules:/rules:ro" \
            grafana/cortex-tools:latest rules lint --dry-run --backend=loki /rules/homelab/alerts.yml
      - name: Check Alertmanager config
        run: |
          docker run --rm -v "$PWD/config/logging:/cfg:ro" --entrypoint amtool \
            prom/alertmanager:latest check-config /cfg/alertmanager.yml

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck --severity=warning

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check .
      - run: uvx ruff format --check .

  pytest:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q
